[project]
name = "airbnb-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.uv]
dev-dependencies = ["ruff>=0.4", "pytest>=8.0"]

[tool.ruff.lint]
select = ["E", "F", "I"]
