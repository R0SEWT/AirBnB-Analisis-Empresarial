city: mexico_city
country: mexico
source: inside_airbnb

raw_file: data/bronze/mexico/listings.csv

required_columns:
  - id
  - name
  - host_id
  - neighbourhood
  - room_type
  - price
  - minimum_nights
  - number_of_reviews
  - reviews_per_month
  - availability_365
  - calculated_host_listings_count

bronze:
  output: data/bronze/mexico_listings_bronze.parquet
  price_currency_symbol: "$"

silver:
  output: data/silver/mexico_listings_silver.parquet
  price_outlier_percentile: 99

gold:
  segments_output: data/gold/mart_listing_segments.parquet
  profiles_output: data/gold/segment_profiles.csv

segmentation:
  k_min: 2
  k_max: 7
  random_state: 42
  features:
    log1p_scaled:
      - price
      - minimum_nights
      - number_of_reviews
      - calculated_host_listings_count
      - reviews_per_month
    scaled:
      - availability_365
    onehot:
      - room_type

review_segmentation:
  raw_reviews: data/bronze/mexico/reviews.csv
  output_segments: data/gold/mart_review_segments.parquet
  output_labels: data/gold/review_segment_labels.csv
  tfidf:
    max_features: 5000
    min_df: 2
    max_df: 0.9
    ngram_range: [1, 2]
    stop_words: english
  svd_components: 100
  k_min: 2
  k_max: 7
  random_state: 42
  top_label_terms: 5
